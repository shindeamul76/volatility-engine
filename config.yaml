# Volatility Engine Configuration

market:
  underlying: NIFTY
  spot: 25455.35
  timezone: Asia/Kolkata

pricing:
  risk_free_rate: 0.065  # 6.5% annualized (0.065)
  dividend_yield: 0.00  # 0% for index options

# Selection Heuristics for Stability & Performance
selection:
  log_moneyness_window: 0.10     # Only use strikes within |ln(K/F)| <= 0.10
  min_points_per_expiry: 20      # Skip expiry if less than 20 valid IV points
  target_points_per_expiry: 50   # Ideal point count for skew fitting
  max_points_per_expiry: 60      # Recommended sweet spot cap for stability

risk:
  contract_multiplier: 65
  scenario:
    spot_shocks: [-0.2, -0.1, -0.05, 0, 0.05, 0.1, 0.2]
    vol_shocks_abs: [-0.10, -0.05, 0, 0.05, 0.10]
    time_shifts_days: [0, 7, 14]
  payoff:
    grid_min_mult: 0.5
    grid_max_mult: 1.5
    grid_steps: 400
    min_score: 0.5
  take_profit: 0.3
  stop_loss: 0.5
  roll_min_score_diff: 0.1

live:
  enabled: true
  symbol: NIFTY
  expiries:
    # - "24-Feb-2026"
    - "10-Mar-2026"
    - "17-Mar-2026"
    - "24-Mar-2026"
    - "30-Mar-2026"
  interval_mins: 1
  fallback_dir: "testdata/snapshots"

risk_gate:
  enabled: true
  max_debit_per_trade_inr: 25000   # Max debit for long premium trades (₹)
  max_loss_per_trade_inr: 50000    # Max worst-case loss per trade (₹)
  max_total_risk_inr: 80000        # Total open risk cap (₹)
  max_daily_loss_inr: 10000        # Daily loss circuit breaker (₹)
  max_drawdown_pct: 0.10           # 10% max drawdown
  risk_per_trade_pct: 0.02         # 2% of equity per trade
  max_lots_per_trade: 10           # Hard cap on lots

execution:
  tick_size: 0.05  # NSE NIFTY options tick size
  slippage:
    mode: "none"  # "none" | "bps" | "ticks"
    bps: 0        # basis points (e.g., 5 = 0.05%)
    ticks: 0      # number of ticks
  fees:
    per_leg: 20   # Flat fee per leg (INR)
    per_order: 0  # Flat fee per order (INR)
    bps: 0        # Fee in bps on notional (e.g. 1 = 0.01%)

report:
  top_n: 3
  formats: ["json", "markdown"]
  out_dir: "reports"
  workers: 4

# CSV files to ingest (one per expiry)
# Add more files as needed for multi-expiry IV30 calculation
files:
  - path: testdata/snapshots/16-02-2026/option-chain-ED-NIFTY-17-Feb-2026.csv
    expiry: "2026-02-17T15:30:00"
  - path: testdata/snapshots/16-02-2026/option-chain-ED-NIFTY-24-Feb-2026.csv
    expiry: "2026-02-24T15:30:00"
  - path: testdata/snapshots/16-02-2026/option-chain-ED-NIFTY-02-Mar-2026.csv
    expiry: "2026-03-02T15:30:00"
  - path: testdata/snapshots/16-02-2026/option-chain-ED-NIFTY-10-Mar-2026.csv
    expiry: "2026-03-10T15:30:00"
  - path: testdata/snapshots/16-02-2026/option-chain-ED-NIFTY-30-Mar-2026.csv
    expiry: "2026-03-30T15:30:00"
  - path: testdata/snapshots/16-02-2026/option-chain-ED-NIFTY-28-Apr-2026.csv
    expiry: "2026-04-28T15:30:00"


